# Single source of truth for every plugin and library version.
#
# Toolchain note: AGP 9.1 / Gradle 9.3.1 / compileSdk 37, needed by Compose 1.12
# and material3 1.5 (their AARs require compileSdk 37 and AGP 9.1+). Android
# Studio Panda 2 (2025.3.2) or newer opens this project. Kotlin is built into
# AGP 9: there is no kotlin-android plugin. Compose 1.13+ needs compileSdk 37.1
# and a newer AGP (see docs/ARCHITECTURE.md, "Upgrading the toolchain").

[versions]
agp = "9.1.1"
kotlin = "2.3.21"
coroutines = "1.10.2"

# AndroidX
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
splashscreen = "1.2.0"
# The settings (Preferences DataStore).
datastore = "1.1.7"
# Compose 1.12.x.
composeBom = "2026.09.00"
# Material 3 Expressive (MotionScheme, MaterialShapes, connected button groups,
# floating toolbars, loading and wavy progress indicators) is public only on the
# 1.5.0 line, which has no stable release yet: the BOM would pick 1.4.0, so the
# version is pinned. Built on Compose 1.12 and graphics-shapes 1.0.1. Move to
# 1.5.0 stable when it is published.
material3 = "1.5.0-beta01"
# MaterialShapes and their morphs are RoundedPolygons from here.
graphicsShapes = "1.0.1"
# Last published release of the extended icon set; it is no longer versioned with Compose.
materialIconsExtended = "1.7.8"
media3 = "1.10.1"
material = "1.12.0"

# FFmpeg runtime: FFmpegKitNext, the official, source-only continuation of the retired
# FFmpegKit (same com.arthenica.ffmpegkit API), built from pinned sources by
# scripts/build-ffmpeg-kit-next.sh into media/libs (see settings.gradle.kts and
# media/build.gradle.kts). Not on any Maven repository: this is the version of the AAR
# that script makes. 6.1.x = FFmpeg n6.1.6, the line the filter graphs were verified
# against, 16 KB page aligned, arm64-v8a + x86_64 only.
ffmpegKitNext = "6.1.1"
# Its only dependency (Apache 2.0, by FFmpegKit's author), from Maven Central.
smartException = "0.2.1"

# ONNX Runtime's Java API, for the subject cut-out model. Its libonnxruntime.so is
# the only one in the app: sherpa-onnx (built on 1.28.2, same C API version 28) runs
# on it too, from a copy of its AAR without its own (see "sherpa-onnx" in
# app/build.gradle.kts). Keep it on a release with C API version 28 or later.
onnxruntime = "1.28.0"

# Testing
junit = "4.13.2"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Compose artifacts take their versions from the BOM.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
# The preview's media session and notification (background playback).
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Only provides the XML window theme (Theme.Material3.DayNight.NoActionBar).
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

smart-exception-java = { group = "com.arthenica", name = "smart-exception-java", version.ref = "smartException" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
