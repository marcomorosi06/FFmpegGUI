name: Model pins and licences

# On every push and pull request: scripts/check-model-pins.py checks that the
# SHA-256, sizes and release tags the app pins for its AI models agree with
# the locks their files are made from, that the licences and notices bundled
# with the app are the upstream ones, that docs/MODELS.md records every model
# and its licence, and that no retired model's folder is one in use. Offline,
# a few seconds: no model is downloaded. Once a week it also checks online
# that the releases serving the project's own conversions answer and that the
# upstream licences have not changed since they were pinned.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pins:
    name: Check the model pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check
        env:
          ONLINE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$ONLINE" = true ]; then
            python3 -I scripts/check-model-pins.py --online
          else
            python3 -I scripts/check-model-pins.py
          fi
