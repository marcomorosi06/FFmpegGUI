name: AI model files (ONNX)

# The ONNX files this project converts and serves itself (docs/MODELS.md):
# EdgeTAM (Meta, Apache 2.0) for the cut-out correction and the photo editor's
# "lift the subject", BiRefNet-lite (Zheng Peng et al., MIT) for the finest
# cut-out, Bandit v2 (Watcharasupat, Wu, Orife; weights CC BY-SA 4.0) for the
# split into dialogue, music and effects, Spleeter 5 stems (Deezer, MIT) for
# the music's instruments. For each:
#
#   1. build: scripts/export-<model>.py, from exactly what
#      scripts/<model>-onnx.lock pins (upstream commit,
#      weights, licence: every hash checked), with the tools pinned in
#      scripts/model-export-requirements.txt (--require-hashes), twice and
#      independently: on two runner images, the second on two CPU cores only.
#      Each build checks its files against the PyTorch model on random inputs
#      and on real photos, then scripts/check-model-pins.py checks them against
#      the app's pins, the licence and the NOTICE inside and next to them;
#   2. publish: only when both builds are byte-identical, the files go out with
#      the upstream LICENSE, the NOTICE of the changes (Apache 2.0 section 4b)
#      and their PROVENANCE (as LICENSE.txt, NOTICE.txt, PROVENANCE.txt), as a
#      pre-release named by the lock's release_tag (never "latest": the app's
#      own releases stay apart). The app downloads them from there.
#
# It runs only by hand (Actions > AI model files > Run workflow): before the
# first app release that pins new files, or to check that they still build
# to the same bytes (untick "publish"). A release that already exists is never
# replaced: it is checked against the pins instead.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the releases that do not exist yet"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: models-onnx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.model }} on ${{ matrix.runner }}${{ matrix.cpus && ' (2 cores)' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model:
          - edgetam
          - birefnet
          - bandit
          - spleeter
        runner:
          - ubuntu-24.04
          - ubuntu-26.04
        include:
          - runner: ubuntu-26.04
            cpus: "0,1"
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make room on the disk
        run: |
          # PyTorch's wheels are large; toolchains the export does not use go.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Read the lock
        id: lock
        env:
          MODEL: ${{ matrix.model }}
        run: |
          lock="scripts/${MODEL}-onnx.lock"
          value() { awk -v k="$1" '$1 == k { print $2 }' "$lock"; }
          {
            echo "lock=$lock"
            echo "python=$(value python)"
            echo "repository=$(value repository)"
            echo "commit=$(value commit)"
            echo "weights_url=$(value weights_url)"
            echo "weights_sha256=$(value weights_sha256)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ steps.lock.outputs.python }}

      - name: Install the pinned tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r scripts/model-export-requirements.txt
          python -m pip check || true

      - name: Get the upstream code and weights at the pinned commit
        env:
          MODEL: ${{ matrix.model }}
          REPOSITORY: ${{ steps.lock.outputs.repository }}
          COMMIT: ${{ steps.lock.outputs.commit }}
          WEIGHTS_URL: ${{ steps.lock.outputs.weights_url }}
          WEIGHTS_SHA256: ${{ steps.lock.outputs.weights_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/upstream"
          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY" "$RUNNER_TEMP/upstream/code"
          git -C "$RUNNER_TEMP/upstream/code" -c advice.detachedHead=false checkout --quiet "$COMMIT"
          get() { curl --fail --location --silent --show-error --retry 3 -o "$1" "$2"; }
          if [ "$MODEL" = bandit ]; then
            # The weights from Zenodo (MD5 there; the SHA-256 is checked, or learned, by the export).
            lock=scripts/bandit-onnx.lock
            value() { awk -v k="$1" '$1 == k { print $2 }' "$lock"; }
            get "$RUNNER_TEMP/upstream/checkpoint.ckpt" "$(value checkpoint_url)"
            echo "$(value checkpoint_md5)  $RUNNER_TEMP/upstream/checkpoint.ckpt" | md5sum --check
            get "$RUNNER_TEMP/upstream/LICENSE-CC-BY-SA-4.0.txt" "$(value licence_url)"
            echo "$(value licence_sha256)  $RUNNER_TEMP/upstream/LICENSE-CC-BY-SA-4.0.txt" | sha256sum --check
          elif [ "$MODEL" = spleeter ]; then
            lock=scripts/spleeter-onnx.lock
            value() { awk -v k="$1" '$1 == k { print $2 }' "$lock"; }
            for part in weights two_stems sherpa; do
              get "$RUNNER_TEMP/upstream/$part.archive" "$(value ${part}_url)"
              echo "$(value ${part}_sha256)  $RUNNER_TEMP/upstream/$part.archive" | sha256sum --check
            done
            mkdir -p "$RUNNER_TEMP/upstream/five" "$RUNNER_TEMP/upstream/two" "$RUNNER_TEMP/upstream/sherpa"
            tar xzf "$RUNNER_TEMP/upstream/weights.archive" -C "$RUNNER_TEMP/upstream/five"
            tar xzf "$RUNNER_TEMP/upstream/two_stems.archive" -C "$RUNNER_TEMP/upstream/two"
            tar xjf "$RUNNER_TEMP/upstream/sherpa.archive" -C "$RUNNER_TEMP/upstream/sherpa" --strip-components=1
          elif [ "$MODEL" = birefnet ]; then
            get "$RUNNER_TEMP/upstream/weights.pth" "$WEIGHTS_URL"
            echo "$WEIGHTS_SHA256  $RUNNER_TEMP/upstream/weights.pth" | sha256sum --check
            # The photos the masks are checked on: EdgeTAM's own examples, at its pinned commit.
            edgetam_commit=$(awk '$1 == "commit" { print $2 }' scripts/edgetam-onnx.lock)
            git clone --quiet --filter=blob:none --no-checkout --sparse https://github.com/facebookresearch/EdgeTAM "$RUNNER_TEMP/upstream/pictures"
            git -C "$RUNNER_TEMP/upstream/pictures" sparse-checkout set notebooks/images
            git -C "$RUNNER_TEMP/upstream/pictures" -c advice.detachedHead=false checkout --quiet "$edgetam_commit"
            echo "PICTURES=$RUNNER_TEMP/upstream/pictures/notebooks/images" >> "$GITHUB_ENV"
          else
            echo "PICTURES=$RUNNER_TEMP/upstream/code/notebooks/images" >> "$GITHUB_ENV"
          fi

      - name: Export and check
        env:
          MODEL: ${{ matrix.model }}
          CPUS: ${{ matrix.cpus }}
        run: |
          out="$RUNNER_TEMP/out"
          up="$RUNNER_TEMP/upstream"
          pictures=(--pictures "$PICTURES"/truck.jpg "$PICTURES"/groceries.jpg "$PICTURES"/cars.jpg)
          case "$MODEL" in
            edgetam) set -- scripts/export-edgetam.py --edgetam "$up/code" "${pictures[@]}" ;;
            birefnet) set -- scripts/export-birefnet.py --birefnet "$up/code" --weights "$up/weights.pth" "${pictures[@]}" ;;
            bandit) set -- scripts/export-bandit.py --bandit "$up/code" --checkpoint "$up/checkpoint.ckpt" --licence "$up/LICENSE-CC-BY-SA-4.0.txt" ;;
            spleeter) set -- scripts/export-spleeter.py --checkpoint "$up/five" --two-stems "$up/two" --sherpa "$up/sherpa" --licence "$up/code/LICENSE" ;;
          esac
          run() { if [ -n "$CPUS" ]; then taskset -c "$CPUS" "$@"; else "$@"; fi; }
          run python -I "$@" --out "$out"
          {
            echo "### ${MODEL} on ${{ matrix.runner }}${CPUS:+ (CPUs $CPUS)}"
            echo
            echo '```'
            cat "$out/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A lock still of zeros (Bandit v2 before its first build) has nothing
          # to check the files against yet: this run is there to learn them
          # (scripts/pin-stems.py), and nothing of it is published.
          if grep -Eq '^file_sha256 +0{64}$' "scripts/${MODEL}-onnx.lock"; then
            echo "::notice::scripts/${MODEL}-onnx.lock is not pinned yet: run scripts/pin-stems.py with this build's check.json and SHA256SUMS"
            echo "**Not pinned yet**: \`python3 scripts/pin-stems.py ${MODEL} <this build's folder>\`" >> "$GITHUB_STEP_SUMMARY"
          else
            python -I scripts/check-model-pins.py --release-dir "$MODEL=$out"
          fi

      - name: Upload the files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.model }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  publish:
    name: Compare and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: builds

      - name: Compare the two builds of each model
        run: |
          status=0
          for model in edgetam birefnet bandit spleeter; do
            a="builds/${model}-ubuntu-24.04/SHA256SUMS"
            b="builds/${model}-ubuntu-26.04/SHA256SUMS"
            if cmp -s "$a" "$b"; then
              echo "### ${model}: both builds byte-identical" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::The two builds of ${model} differ: nothing of it is published."
              diff "$a" "$b" || true
              status=1
            fi
          done
          exit "$status"

      # A release is made as a draft, its files are uploaded one by one (those
      # already there are left as they are) and downloaded again to be checked
      # against the pins; only then is it published. A run that stopped half
      # way is finished by the next one; a file already published is never
      # replaced (the check refuses a release whose files are not the pinned ones).
      - name: Publish what is not published yet
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API now and then answers 502 (once while it did publish a
          # release), or takes a file and does not keep it: every call is tried
          # again, and every file is uploaded until the release lists it whole.
          retry() {
            local n
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "Failed (attempt $n): $*"
              sleep $((n * 15))
            done
            return 1
          }
          # Name and size of the files the release holds whole.
          held() {
            retry gh release view "$1" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"'
          }
          # The name a side file had before it went out as .txt: edgetam-onnx-1 was
          # published with LICENSE, NOTICE, ... and keeps them (never two copies).
          former() {
            case "$1" in
              LICENSE.txt) echo LICENSE ;;
              NOTICE.txt) echo NOTICE ;;
              PROVENANCE.txt) echo PROVENANCE ;;
              PROVENANCE-second-build.txt) echo PROVENANCE.second-build ;;
              SHA256SUMS.txt) echo SHA256SUMS ;;
              *) echo "$1" ;;
            esac
          }
          for model in edgetam birefnet bandit spleeter; do
            lock="scripts/${model}-onnx.lock"
            tag=$(awk '$1 == "release_tag" { print $2 }' "$lock")
            if grep -Eq '^file_sha256 +0{64}$' "$lock"; then
              echo "::warning::${lock} is not pinned yet: ${model} is not published (scripts/pin-stems.py first)"
              continue
            fi
            dir="builds/${model}-ubuntu-24.04"
            # What goes out: the ONNX files as they are, the files beside them as text files.
            stage="stage/${model}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp "$dir"/*.onnx "$dir/check.json" "$stage/"
            cp "$dir/LICENSE" "$stage/LICENSE.txt"
            cp "$dir/NOTICE" "$stage/NOTICE.txt"
            cp "$dir/PROVENANCE" "$stage/PROVENANCE.txt"
            cp "builds/${model}-ubuntu-26.04/PROVENANCE" "$stage/PROVENANCE-second-build.txt"
            cp "$dir/SHA256SUMS" "$stage/SHA256SUMS.txt"
            files=("$stage"/*)
            echo "::group::${tag}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $tag exists: only what it lacks is uploaded."
            else
              {
                case "$model" in
                  edgetam) echo "EdgeTAM by Meta (Apache License 2.0), converted to ONNX by FFmpeg GUI for its cut-out correction and its \"lift the subject\" gesture." ;;
                  birefnet) echo "BiRefNet-lite (general use) by Zheng Peng et al. (MIT License), converted to ONNX by FFmpeg GUI for its finest subject cut-out." ;;
                  bandit) echo "Bandit v2 (multilingual) by Karn N. Watcharasupat, Chih-Wei Wu and Iroro Orife (weights CC BY-SA 4.0, code Apache License 2.0), converted to ONNX by FFmpeg GUI to split a video's sound into dialogue, music and effects. This file is licensed CC BY-SA 4.0, as its weights." ;;
                  spleeter) echo "Spleeter 5 stems by Deezer (MIT License), converted to ONNX by FFmpeg GUI to split music into vocals, piano, drums, bass and the rest." ;;
                esac
                echo
                echo "Made from the upstream code, weights and licence pinned in \`${lock}\` at ${GITHUB_SHA},"
                echo "twice (ubuntu-24.04; ubuntu-26.04 on two cores), with byte-identical results. Nothing was"
                echo "trained or changed: see NOTICE for what the conversion does, PROVENANCE for everything the"
                echo "files were made from. The licence and the notice are also inside each ONNX file (its metadata)."
                echo
                echo '```'
                cat "$dir/SHA256SUMS"
                echo '```'
                echo
                echo "The record of every model the app can use: docs/MODELS.md. This is not legal advice."
              } > notes.md
              # A create that failed may still have made the release: never two.
              if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$tag" --notes-file notes.md --draft --prerelease --latest=false; then
                sleep 15
                gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
                  retry gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                    --title "$tag" --notes-file notes.md --draft --prerelease --latest=false
              fi
            fi
            # A draft may keep files of an earlier attempt that go out no more.
            if [ "$(retry gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
              retry gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
                if [ ! -f "$stage/$name" ]; then
                  echo "Removing $name from the draft: it is not one of its files."
                  retry gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
                fi
              done
            fi
            # Upload what the release does not hold whole, until it does. A model file
            # counts by name and size; a file beside it by name (old or new) only: a
            # new run writes another PROVENANCE, and the published one stays.
            has() {
              awk -v n="$2" -v z="$3" '$1 == n && (z == "" || $2 == z) { found = 1 } END { exit !found }' <<< "$1"
            }
            for round in 1 2 3; do
              there=$(held "$tag")
              missing=0
              for f in "${files[@]}"; do
                name=$(basename "$f")
                size=$(stat -c %s "$f")
                if [[ "$name" == *.onnx ]]; then
                  has "$there" "$name" "$size" && present=1 || present=0
                else
                  { has "$there" "$name" "" || has "$there" "$(former "$name")" ""; } && present=1 || present=0
                fi
                if [ "$present" = 1 ]; then
                  [ "$round" = 1 ] && echo "Already there: $name"
                else
                  missing=1
                  echo "Uploading $name ($size bytes, round $round)"
                  retry gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$f"
                fi
              done
              [ "$missing" = 0 ] && break
            done
            echo "The release holds:"
            held "$tag" | sed 's/^/  /'
            # What the release holds now, checked as the app will download it.
            rm -rf "published/$model"
            mkdir -p "published/$model"
            retry gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "published/$model" --clobber
            python3 -I scripts/check-model-pins.py --release-dir "$model=published/$model"
            retry gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
            echo "::endgroup::"
            echo "### Published: \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
