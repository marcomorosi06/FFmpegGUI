# What scripts/export-ai-markers.py makes the invisible AI marks' files from,
# and what they come out as (docs/MODELS.md, "The AI marks"). The app pins the
# same (app/.../marking/MarkerModel.kt; scripts/check-model-pins.py checks that
# the two agree), and .github/workflows/ai-markers.yml publishes them as the
# release release_tag of this repository.
#
# A value of zeros is not pinned yet: the workflow then only learns it (it
# downloads, builds and checks everything, publishes nothing) and hands back a
# filled-in lock; scripts/pin-ai-markers.py copies it here, into the app and
# into docs/MODELS.md. Nothing goes out, and the app imports nothing, until
# every value is pinned.

release_tag                 ai-markers-1
python                      3.13
opset                       17

# The fixed window AudioSeal's ONNX files take: 5 s at 16 kHz (core/marking/SpeechMarking.kt).
window                      80000

# AudioSeal, by Meta (facebookresearch). MIT, the weights included ("We have
# updated our license to full MIT license (including the license for the model
# weights)", its README). Its package (the network's code) and its weights.
audioseal_repository        https://github.com/facebookresearch/audioseal
