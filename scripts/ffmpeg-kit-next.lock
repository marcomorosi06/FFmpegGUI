# Sources of the FFmpeg runtime, pinned to a commit.
#
# scripts/build-ffmpeg-kit-next.sh builds FFmpegKitNext (the official, source-only
# continuation of FFmpegKit) from these sources and stops if any of them is not the
# commit written here: a moved tag or a changed mirror fails the build before its
# code is compiled.
#
# "kit" is FFmpegKitNext itself; each "lib" is a source its Android build may
# download (scripts/source.sh of that FFmpegKitNext commit), with the tag the build
# asks for and the commit that tag pointed to when this file was written. "-" as tag
# means the build asks for the commit itself.
#
# Checked on 2026-10-18 against the upstream projects' own repositories, where they
# are on GitHub: ffmpeg (FFmpeg/FFmpeg n6.1.6), libass, dav1d, freetype, harfbuzz,
# fribidi, opus, libvorbis, libogg, zimg, libvidstab, expat, libpng, cpu-features
# and x264 (mirror/x264) are the very same commits.
#
# To move to another FFmpegKitNext release: change the kit line, then regenerate
# every lib line from that release's scripts/source.sh (scripts/build-ffmpeg-kit-next.sh
# refuses a lock that disagrees with it) and check them again. Read that release's
# flake.nix and nix.conf too: a nixConfig block (binary caches, other settings) is
# not taken by the build (NIX_CONFIG="accept-flake-config = false"), but should be
# understood. The build only gets the variables listed in KEEP_ENV (in the build
# script): if a new release needs another one, add it there.
#
# "gradle" is the Gradle distribution FFmpegKitNext's Android project (android/)
# packs the AAR with: its URL (it must be the one of that project's
# gradle-wrapper.properties), its version and its SHA-256, from
# https://gradle.org/release-checksums/ (Gradle 8.14.5, binary-only ZIP). The
# project's gradle-wrapper.jar, pinned by the kit commit, is Gradle 8.13's official
# one (SHA-256 81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f).
# The Gradle plugins and libraries it downloads are pinned by
# scripts/ffmpeg-kit-next.verification-metadata.xml (see the build script). Its
# unit tests do not run (an init script turns them off), so a test framework that
# downloads by itself (Robolectric, from FFmpegKitNext releases after 6.1.1) does
# not either; check that a new release still runs nothing else outside Gradle.
#
