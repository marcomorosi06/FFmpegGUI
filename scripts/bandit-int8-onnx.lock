# What scripts/export-bandit-int8.py makes the int8 build of Bandit v2 from,
# and with what. The ONNX file the app pins (app/.../voice/StemModels.kt,
# BANDIT_INT8) is made from exactly these (see docs/MODELS.md, "Bandit v2,
# int8: our ONNX file"). It is made from this project's own float file, not
# from the checkpoint again: the values about the weights are those of
# scripts/bandit-onnx.lock, and the script checks that the two agree.

# The authors' code and the weights' licence (CC BY-SA 4.0, which this file
# keeps: it is an adaptation of the weights too).
repository          https://github.com/kwatcharasupat/bandit-v2
commit              d5563d9031e95fdaa3e5a73d5020b9a0df61adb6
licence_url         https://raw.githubusercontent.com/spdx/license-list-data/v3.27.0/text/CC-BY-SA-4.0.txt
licence_sha256      cde7883b9050a1104f4ac19a1572aafd6e5d7323b68351aaf51fbf4beba54966
checkpoint          checkpoint-multi.ckpt
checkpoint_md5      fea2868787551b0cff36cfcf7c3622a3
checkpoint_sha256   abcfccf65446752a057f4a302c941479a54b7560ebf8d7bca039d2ea98e64cfc

# The float file it starts from: the release of this repository that serves
# it, checked against scripts/bandit-onnx.lock and against this.
source_file         bandit-v2-multi.onnx
source_sha256       7836f01622021adc2fe2570f263ec365ef7677d598b51d27b015b94d869f2ff2
source_tag          bandit-onnx-2

# How: the GRUs written out (16 of them), then dynamic quantisation with this
# ONNX Runtime (the quantised bytes depend on it; the script refuses another).
grus                16
onnxruntime         1.31.1

# What it comes out as, byte for byte: the SHA-256 and size the app pins
# (scripts/check-model-pins.py checks that the two agree), and the release of
# this repository that serves it. Zeros until the first run of the workflow
# (scripts/pin-stems.py bandit-int8 writes them): until then the app cannot
# import it.
file                bandit-v2-multi-int8.onnx
file_sha256         3a4a054b8e07c553d5f19f9f72ad52a1d5049c6355e0512f33b9e2f5ae7579a9
file_bytes          40260047
release_tag         bandit-int8-onnx-1

# The tools that write it: the same as the other models' (Python 3.13, CPU
# only), installed with --require-hashes from scripts/model-export-requirements.txt.
python              3.13
